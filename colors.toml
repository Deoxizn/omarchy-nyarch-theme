# nyarch — Omarchy theme (Quattro / 4.5)
# Inspired by Nyarch Linux and its Arch-chan / Nyarch Assistant waifu:
# baby blue on black. Not affiliated with Nyarch Linux.
# Palette frozen from the Nyarch Assistant art: near-black UI (#121315),
# navy surfaces (#2c3949), pale baby blue (#c6e2e3), bright blue trim.
# Extra keys follow the Bloom Protocol 4.5 model: border tokens, ANSI
# color0-15 block, and signal/data slots, so templates and terminals that
# read beyond the 26 semantic keys still get Nyarch colours.
