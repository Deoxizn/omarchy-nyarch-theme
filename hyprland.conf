# nyarch — Hyprland overrides (applied on top of the generated theme)
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgb(7cc7e8) rgb(4da3d8) 45deg
    col.inactive_border = rgb(2c3949)
}
decoration {
    rounding = 12
    blur {
        enabled = true
        size = 8
        passes = 2
    }
}
