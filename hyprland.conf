# nyarch — Hyprland overrides, pre-Lua form (kept for compat, Bloom-style).
# The live form is hyprland.lua; Hyprland is Lua now.
$activeBorderColor = rgb(7cc7e8) rgb(4da3d8) 45deg
$inactiveBorderColor = rgba(2c394999)
general {
  col.active_border = $activeBorderColor
  col.inactive_border = $inactiveBorderColor
  border_size = 2
  gaps_in = 6
  gaps_out = 12
}
decoration {
  rounding = 12
  blur {
    enabled = true
    size = 8
    passes = 2
  }
  shadow {
    enabled = true
    range = 16
    render_power = 3
    offset = 2 5
    color = rgba(12161acc)
  }
}
